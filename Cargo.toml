[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"

[workspace.package]
version = "0.3.0"
license = "Apache-2.0"
authors = ["Jessica Cox <jmcox@posteo.de>"]
edition = "2024"
rust-version = "1.89"

[package]
name = "fido2kpxc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Unlock KeePassXC with a FIDO2 security key PIN and touch"
publish = false

[lib]
path = "src/lib.rs"
# The binary compiles these modules itself and runs their tests, so the library skips them.
test = false
doctest = false

[dependencies]
anyhow = "1"
fido2kit = { path = "../fido2kit/fido2kit" }
fido2kit-mac = { path = "../fido2kit/fido2kit-mac" }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "objc2-core-foundation", "NSApplication", "NSButton", "NSCell", "NSGraphics", "NSLayoutConstraint", "NSControl", "NSEvent", "NSImage", "NSImageView", "NSMenu", "NSMenuItem", "NSOpenPanel", "NSPanel", "NSPasteboard", "NSPasteboardItem", "NSPopUpButton", "NSResponder", "NSRunningApplication", "NSSavePanel", "NSSecureTextField", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSTextField", "NSView", "NSWindow", "NSWorkspace"] }
objc2-application-services = { version = "0.3", default-features = false, features = ["std", "libc", "HIServices", "AXError", "AXUIElement"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFBase", "CFDictionary", "CFNumber", "CFString"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSBundle", "NSData", "NSDictionary", "NSEnumerator", "NSError", "NSGeometry", "NSNotification", "NSObject", "NSProcessInfo", "NSRunLoop", "NSString", "NSTimer", "NSURL", "NSUserDefaults", "NSValue"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
toml = "1"
zeroize = "1"

[dev-dependencies]
# Tests draw the menu-bar icons into a bitmap.
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSBitmapImageRep", "NSGraphicsContext", "NSImageRep"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"
