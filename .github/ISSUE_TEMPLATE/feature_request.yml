name: Feature request
description: Suggest a change to how fido2kpxc unlocks KeePassXC.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        fido2kpxc does one thing: it unlocks KeePassXC with a FIDO2 security key. Key management, such as setting or changing a PIN, belongs in the vendor's tool.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you want to do, and why fido2kpxc does not let you do it now.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change you have in mind, if any.
