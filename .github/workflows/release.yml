# Builds a pushed v* tag through the reusable build workflow, then publishes the GitHub Release.
name: release

on:
  push:
    tags: ['v*']

permissions: {}

# Two releases never build at once, and a running release is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: read # check out the tag
      id-token: write # sign the provenance
      attestations: write # store the provenance
    # A called workflow's job gets its environment's secrets only through inherit. The repository
    # holds no other secrets, so inherit passes only the release environment's signing identity.
    secrets: inherit # zizmor: ignore[secrets-inherit]

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installers
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "fido2kpxc ${TAG#v}" --generate-notes --verify-tag
