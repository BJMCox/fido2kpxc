# Builds a pushed v* tag through the reusable build workflow, then publishes the GitHub Release.
name: release

on:
  push:
    tags: ['v*']

permissions: {}

# Two releases never build at once, and a running release is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: read # check out the tag
      id-token: write # sign the provenance
      attestations: write # store the provenance
    # A called workflow's job gets its environment's secrets only through inherit. The repository
    # holds no other secrets, so inherit passes only the release environment's signing identity.
    secrets: inherit # zizmor: ignore[secrets-inherit]

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installers
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "fido2kpxc ${TAG#v}" --generate-notes --verify-tag

  virustotal:
    name: Scan on VirusTotal
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The API key lives in this environment, which only v* tags can use. It has no reviewers, and
    # it keeps the key out of the signing build, which inherits the repository's secrets.
    environment: virustotal
    permissions:
      contents: write # add the scan links to the release notes
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installers
          path: dist
      - name: Upload the installers and link their scans
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$VT_API_KEY" ]; then
            echo "::error::The virustotal environment's VT_API_KEY did not reach this job."
            exit 1
          fi
          links=""
          for file in dist/*.dmg dist/*.pkg; do
            # The key goes through stdin, so it never shows in the process list.
            printf 'x-apikey: %s\n' "$VT_API_KEY" |
              curl --fail-with-body --silent --show-error --retry 3 --header @- \
                --form "file=@$file" https://www.virustotal.com/api/v3/files > /dev/null
            sha256="$(sha256sum "$file" | cut -d ' ' -f 1)"
            links="$links- [$(basename "$file")](https://www.virustotal.com/gui/file/$sha256)"$'\n'
          done
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          # A rerun uploads again but keeps the links it already added.
          if ! grep -qx '## VirusTotal' notes.md; then
            printf '\n## VirusTotal\n\n%s' "$links" >> notes.md
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          fi
